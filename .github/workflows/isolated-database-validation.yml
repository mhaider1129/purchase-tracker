name: Manual isolated database validation
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full immutable commit that passed code CI
        required: true
        type: string
      confirm_disposable_only:
        description: Explicitly authorize synthetic disposable PostgreSQL fixtures only
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  postgres:
    if: ${{ inputs.confirm_disposable_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [schema, p2p, contracts, contract-settlement, contract-finance, reconciliation, request-workspace, device-demos, completion, receipt-reporting, governance, rfid, events, scop-foundation, guided-requests, hosted-recovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: purchase-backend/package-lock.json
      - name: Bind explicit immutable fixture input
        env:
          SELECTED_COMMIT: ${{ inputs.commit_sha }}
        run: node -e "const cp=require('node:child_process');const s=process.env.SELECTED_COMMIT;if(!/^[a-f0-9]{40}$/.test(s)||cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==s)process.exit(1)"
      - run: npm ci
        working-directory: purchase-backend
      - run: node scripts/devops/integrity.cjs --base-ref refs/remotes/origin/master
      # Existing runners create fresh loopback-only disposable databases; no
      # hosted URLs, database secrets or recovery execution inputs are provided.
      - run: node scripts/quality/release.cjs gate "${{ matrix.gate }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: manual-postgres-evidence-${{ matrix.gate }}
          path: quality-results/
          if-no-files-found: error
