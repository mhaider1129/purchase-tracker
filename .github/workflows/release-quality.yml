name: Release quality
on:
  pull_request:
  push:
    branches: [master, "codex/**", "develop/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true
# No database/application secrets or deployment environments are available here.
env:
  CI: 'true'
  LIVE_ROUTING_ENABLED: 'false'
jobs:
  backend:
    outputs:
      backend_artifact_id: ${{ steps.backend_release.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: purchase-backend/package-lock.json
      - run: npm ci
        working-directory: purchase-backend
      - run: node scripts/quality/release.cjs group backend
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: node scripts/devops/backend-artifact.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: backend_release
        with:
          name: backend-release-attempt-${{ github.run_attempt }}
          path: release-artifacts/backend/
          # Packager already excluded env/local files; preserve committed dotfiles.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-evidence-backend-attempt-${{ github.run_attempt }}
          path: quality-results/
          if-no-files-found: error
          retention-days: 14
  frontend:
    outputs:
      frontend_artifact_id: ${{ steps.frontend_release.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: purchase-frontend/package-lock.json
      - run: npm ci
        working-directory: purchase-frontend
      - run: node scripts/quality/release.cjs group frontend
      - run: node scripts/devops/security.cjs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-evidence-frontend-attempt-${{ github.run_attempt }}
          path: quality-results/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: frontend_release
        with:
          name: frontend-build-attempt-${{ github.run_attempt }}
          path: purchase-frontend/build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: purchase-backend/package-lock.json
      - run: npm ci
        working-directory: purchase-backend
      - run: node scripts/devops/integrity.cjs --base-ref refs/remotes/origin/master
      - run: node --test scripts/devops/automation.test.cjs scripts/devops/release-selection.test.cjs scripts/devops/security-regression.test.cjs scripts/devops/artifact-json.test.cjs scripts/devops/sync-publish.test.cjs scripts/devops/sync-evidence.test.cjs
      - run: npm test -- --runInBand --forceExit --json --outputFile=platform-test-results.json databaseReleasePaths.test.js databaseReleaseGovernance.test.js wiciRecoveryProfiles.test.js
        working-directory: purchase-backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-integrity-${{ matrix.os }}-node${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: purchase-backend/platform-test-results.json
          if-no-files-found: error
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate workflow definitions with checksum-pinned actionlint
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # The only intentional lint exception is the three hard-disabled
          # release templates. Regression tests forbid this guard elsewhere.
          "$RUNNER_TEMP/actionlint" -ignore 'constant expression "false" in condition' .github/workflows/*.yml
      - run: node scripts/devops/security.cjs
  sync-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mhaider1129/purchase-backend
          ref: main
          path: sync-inputs/backend
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mhaider1129/purchase-frontend
          ref: main
          path: sync-inputs/frontend
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/devops/sync-audit.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synchronization-dry-run-attempt-${{ github.run_attempt }}
          path: quality-results/sync/
          if-no-files-found: error
  release-quality-gate:
    name: Code CI gate (not deployment approval)
    if: always()
    needs: [backend, frontend, integrity, security, sync-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/devops/code-evidence.cjs quality-results/code-ci-manifest.json
        if: always()
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: code-ci-manifest-attempt-${{ github.run_attempt }}
          path: quality-results/code-ci-manifest.json
          if-no-files-found: error
