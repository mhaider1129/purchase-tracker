name: Database release path compatibility
on:
  push:
    branches: [codex/database-release-posix-paths]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: purchase-backend
    env:
      NODE_ENV: test
      LIVE_ROUTING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: purchase-backend/package-lock.json
      - run: npm ci
      - name: Path regressions
        run: npm test -- --runInBand --forceExit --json --outputFile=path-test-results.json databaseReleasePaths.test.js
      - name: Checked-in inventory and recovery gates (fail closed)
        if: always()
        run: npm test -- --runInBand --forceExit --json --outputFile=governance-test-results.json databaseReleaseGovernance.test.js wiciRecoveryProfiles.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-path-results-${{ matrix.os }}
          path: |
            purchase-backend/path-test-results.json
            purchase-backend/governance-test-results.json
          if-no-files-found: error
