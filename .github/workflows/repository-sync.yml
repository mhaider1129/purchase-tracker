name: SCOP repository synchronization
on:
  workflow_run:
    workflows: [Release quality]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: scop-repository-sync
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend_plan: ${{ steps.plan.outputs.backend_plan }}
      frontend_plan: ${{ steps.plan.outputs.frontend_plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mhaider1129/purchase-backend
          ref: main
          path: sync-inputs/backend
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mhaider1129/purchase-frontend
          ref: main
          path: sync-inputs/frontend
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify source CI and produce credential-free reconciliation evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SCOP_SYNC_GOVERNANCE_TOKEN: ${{ secrets.SCOP_SYNC_GOVERNANCE_TOKEN }}
        run: node scripts/devops/sync-release.cjs plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sync-readiness-attempt-${{ github.run_attempt }}
          path: quality-results/sync-release/
          if-no-files-found: error
  publish:
    # HARD STOP: bootstrap plan and publishing permissions need separate review.
    # Activation requires a reviewed workflow + policy change; a secret or
    # repository variable alone cannot enable this job.
    if: ${{ false }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    concurrency:
      group: scop-publish-${{ matrix.app }}
      cancel-in-progress: false
    environment: scop-sync-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mhaider1129/purchase-backend
          ref: main
          path: sync-inputs/backend
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mhaider1129/purchase-frontend
          ref: main
          path: sync-inputs/frontend
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Revalidate after approval, mint single-repository token, open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          SCOP_SYNC_GOVERNANCE_TOKEN: ${{ secrets.SCOP_SYNC_GOVERNANCE_TOKEN }}
          SCOP_SYNC_ENVIRONMENT: scop-sync-publish
          SYNC_APP: ${{ matrix.app }}
          APPROVED_PLAN_DIGEST: ${{ matrix.app == 'backend' && needs.plan.outputs.backend_plan || needs.plan.outputs.frontend_plan }}
          SCOP_SYNC_APP_ID: ${{ vars.SCOP_SYNC_APP_ID }}
          SCOP_SYNC_INSTALLATION_ID: ${{ vars.SCOP_SYNC_INSTALLATION_ID }}
          SCOP_SYNC_PRIVATE_KEY: ${{ secrets.SCOP_SYNC_PRIVATE_KEY }}
        run: node scripts/devops/sync-release.cjs publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sync-publication-${{ matrix.app }}-attempt-${{ github.run_attempt }}
          path: quality-results/sync-release/
          if-no-files-found: error
