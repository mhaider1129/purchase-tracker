# INSTALL ONLY through a separately authorized destination PR.
name: Standalone backend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Backend synchronization gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      LIVE_ROUTING_ENABLED: 'false'
      EMAIL_DRY_RUN: 'true'
      SMTP_DRY_RUN: 'true'
      DATABASE_URL: postgresql://ci_blocked:ci_blocked@127.0.0.1:1/ci_no_database
      JWT_SECRET: disposable-ci-only-not-a-login-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --forceExit --json --outputFile=unit-results.json
      - name: Reject empty, failed or skipped unit evidence
        run: node -e "const r=require('./unit-results.json');if(!r.success||r.numPassedTests<1||r.numFailedTests||r.numFailedTestSuites||r.numPendingTests)process.exit(1)"
      - name: Verify raw locked inventory without a database
        run: node -e "const i=require('./scripts/lib/databaseRelease/inventory');if(i.verifyFiles(require('./database/releases/migration-inventory.json')).length)process.exit(1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-unit-results-attempt-${{ github.run_attempt }}
          path: unit-results.json
          if-no-files-found: error
