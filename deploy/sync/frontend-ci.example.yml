# INSTALL ONLY through a separately authorized destination PR.
name: Standalone frontend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Frontend synchronization gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      LIVE_ROUTING_ENABLED: 'false'
      REACT_APP_API_URL: /api
      REACT_APP_API_BASE_URL: /api
      REACT_APP_API_BASE: /api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --json --outputFile=unit-results.json
      - name: Reject empty, failed or skipped unit evidence
        run: node -e "const r=require('./unit-results.json');if(!r.success||r.numPassedTests<1||r.numFailedTests||r.numFailedTestSuites||r.numPendingTests)process.exit(1)"
      - run: npm run lint -- --max-warnings=0
      - run: node scripts/audit-ui-translations.cjs
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-unit-results-attempt-${{ github.run_attempt }}
          path: unit-results.json
          if-no-files-found: error
