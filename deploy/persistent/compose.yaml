name: scop-persistent-staging
x-staging-log: &staging-log
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
services:
  database:
    logging: *staging-log
    profiles: [separately-approved-database]
    image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    container_name: scop-${SCOP_INSTANCE:?approved instance required}-database
    labels:
      wici.scop.instance: ${SCOP_INSTANCE}
    env_file: /etc/scop-staging/database-owner.env
    restart: "no"
    volumes:
      - type: bind
        source: /var/lib/scop-staging/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      data:
        aliases: [database]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 6
  gateway:
    logging: *staging-log
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
    profiles: [separately-approved-gateway]
    image: caddy:2@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    container_name: scop-${SCOP_INSTANCE}-gateway
    labels:
      wici.scop.instance: ${SCOP_INSTANCE}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: "no"
    ports: ["443:443"]
    volumes:
      - /var/lib/scop-staging/gateway:/routes:ro
      - /etc/scop-staging/tls:/certs:ro
      - /etc/scop-staging/access:/access:ro
    tmpfs: [/data, /config]
    command: [caddy, run, --config, /routes/Caddyfile, --adapter, caddyfile]
    networks:
      ingress: {}
      edge:
        ipv4_address: 172.30.60.10
  agent:
    logging: *staging-log
    profiles: [separately-approved-agent]
    image: ${SCOP_AGENT_IMAGE:?independently reviewed agent image digest required}
    container_name: scop-${SCOP_INSTANCE}-agent
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    environment:
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NODE_USE_ENV_PROXY: "1"
      NO_PROXY: ""
      no_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc/sys/kernel/random/boot_id:/run/scop-host-boot-id:ro
      - /var/lib/scop-staging:/var/lib/scop-staging
      - /etc/scop-staging/config.json:/etc/scop-staging/config.json:ro
      - /etc/scop-staging/github-app.pem:/etc/scop-staging/github-app.pem:ro
      - /etc/scop-staging/runtime.json:/etc/scop-staging/runtime.json:ro
      - /etc/scop-staging/probe:/etc/scop-staging/probe:ro
    tmpfs: [/tmp]
    networks: [control]
  egress:
    logging: *staging-log
    profiles: [separately-approved-egress]
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: "no"
    volumes: [/etc/scop-staging/squid.conf:/etc/squid/squid.conf:ro]
    networks:
      control: {}
      edge:
        ipv4_address: 172.30.60.20
networks:
  data:
    name: scop-${SCOP_INSTANCE}-data
    internal: true
  ingress:
    name: scop-${SCOP_INSTANCE}-ingress
    internal: true
  control:
    name: scop-${SCOP_INSTANCE}-control
    internal: true
  edge:
    name: scop-${SCOP_INSTANCE}-edge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.60.0/24
