#cloud-config
# Staging-only base OS preparation. No repository clone, secrets, deployment,
# SQL, production routes or automatic service activation.
package_update: true
# Quarantine both Docker entry points before package installation, once only.
# Operators may unmask only after the reviewed firewall/drop-ins/config exist.
bootcmd:
  - [cloud-init-per, once, scop-docker-quarantine, systemctl, mask, --now, docker.service, docker.socket, nftables.service]
packages: [docker.io, docker-compose-v2, ca-certificates, nftables, python3]
ssh_pwauth: false
disable_root: true
write_files:
  - path: /etc/scop-staging/host-purpose
    permissions: "0444"
    content: wici-isolated-staging-v1
  - path: /etc/scop-staging/ACTIVATION_PENDING
    permissions: "0400"
    content: |
      Approved IaC provisioning does not activate the staging agent.
      Mount the dedicated volume, configure TLS/access, initialize the synthetic
      database under separate approval, verify isolation and install a reviewed
      pinned control-plane image before authorizing service activation.
runcmd:
  - [install, -d, -m, "0700", /etc/scop-staging]
